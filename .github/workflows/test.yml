name: tests

# The single source of truth for "did tests pass". Runs standalone on pushes,
# PRs and releases, and is also called by the release workflow (workflow_call)
# so it gates on this without duplicating steps.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_call: {}

jobs:
  test:
    # push/release always run. PRs run only when the author is an org
    # member/maintainer, so unreviewed or fork code never runs with this
    # workflow's token. workflow_call passes through: the calling release
    # workflow only fires on trusted events.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04-arm
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags so setuptools-scm can derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install package and test dependencies
        run: pip install --isolated -e . -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest --cov-fail-under=90
